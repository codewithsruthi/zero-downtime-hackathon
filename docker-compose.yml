services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    environment:
      SIGNOZ_INGESTION_KEY: ${SIGNOZ_INGESTION_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SIGNOZ_OTLP_ENDPOINT:-https://ingest.us.signoz.cloud:443}
